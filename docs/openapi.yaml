openapi: 3.0.1
info:
  title: Integrated Personal Budget API
  description: Self-hosted personal budgeting system API
  version: "1.0.0"
  contact:
    name: Budget Agent
    email: maintainer@example.com
servers:
  - url: http://127.0.0.1:8080
    description: Local development server
paths:
  /api/v1/healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/v1/readyz:
    get:
      summary: Readiness check
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready

  /api/v1/accounts:
    get:
      summary: List accounts
      parameters:
        - name: X-Workspace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of accounts
    post:
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/CreateAccountInput"
      responses:
        "201":
          description: Account created
        "400":
          description: Bad request
  /api/v1/accounts/{id}:
    get:
      summary: Get account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Workspace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Account details
        "404":
          description: Not found
    patch:
      summary: Update account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/UpdateAccountInput"
      responses:
        "200":
          description: Updated account
        "404":
          description: Not found
        "400":
          description: Bad request
  /api/v1/accounts/{id}/balance:
    get:
      summary: Get account balance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Workspace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Account balance in minor units
  /api/v1/tags:
    get:
      summary: List tags
      parameters:
        - name: X-Workspace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of tags
    post:
      summary: Create tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/CreateTagInput"
      responses:
        "201":
          description: Tag created
        "400":
          description: Bad request
        "409":
          description: A tag with that name already exists
  /api/v1/tags/{id}:
    get:
      summary: Get tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tag details
        "404":
          description: Not found
    patch:
      summary: Rename or recolor a tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/UpdateTagInput"
      responses:
        "200":
          description: Updated tag
        "400":
          description: Bad request
        "404":
          description: Not found
        "409":
          description: A tag with that name already exists
    delete:
      summary: Delete a tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Tag deleted
        "404":
          description: Not found
  /api/v1/transactions:
    get:
      summary: List transactions
      parameters:
        - name: X-Workspace-Id
          in: header
          required: false
          schema:
            type: string
        - name: from
          in: query
          description: Inclusive lower bound; a date-only value starts at 00:00:00 UTC.
          schema:
            type: string
        - name: to
          in: query
          description: Inclusive upper bound; a date-only value ends at 23:59:59 UTC.
          schema:
            type: string
        - name: account_id
          in: query
          schema:
            type: string
        - name: tag
          in: query
          description: Repeated tag IDs are matched with OR semantics.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: min_amount_minor
          in: query
          schema:
            type: integer
            format: int64
        - name: max_amount_minor
          in: query
          schema:
            type: integer
            format: int64
        - name: q
          in: query
          description: Case-insensitive search across description and notes.
          schema:
            type: string
            maxLength: 200
        - name: source
          in: query
          schema:
            type: string
            enum:
              - manual
              - whatsapp
              - mcp
              - receipt
              - import
        - name: include_transfers
          in: query
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - occurred_at
              - "-occurred_at"
              - amount_minor
              - "-amount_minor"
            default: "-occurred_at"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: Opaque cursor from a previous response's `next_cursor`.
          schema:
            type: string
      responses:
        "200":
          description: A page of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400":
          description: Invalid filter, sort, limit, or cursor
    post:
      summary: Create transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionInput"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Bad request
  /api/v1/transactions/{id}:
    get:
      summary: Get transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Workspace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Transaction details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
    patch:
      summary: Update transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransactionInput"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
        "400":
          description: Bad request
    delete:
      summary: Delete transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Workspace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "204":
          description: No content
        "404":
          description: Not found
  /api/v1/budgets:
    get:
      summary: List budgets
      parameters:
        - name: X-Workspace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of budgets
    post:
      summary: Create budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/CreateBudgetInput"
      responses:
        "201":
          description: Budget created
        "400":
          description: Bad request
  /api/v1/budgets/{id}:
    get:
      summary: Get budget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Workspace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Budget details
        "404":
          description: Not found
    patch:
      summary: Update budget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/UpdateBudgetInput"
      responses:
        "200":
          description: Updated budget
        "404":
          description: Not found
        "400":
          description: Bad request
  /api/v1/budgets/{id}/summary:
    get:
      summary: Get budget tag-based summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Workspace-Id
          in: header
          required: false
          schema:
            type: string
        - name: tag_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Budget summary per tag
  /api/v1/dashboard:
    get:
      summary: Get the dashboard read model
      parameters:
        - name: X-Workspace-Id
          in: header
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive start date. Defaults to the first day of the current month.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Inclusive end date. Must be provided with `from`.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Dashboard totals, budget progress, and recent transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "400":
          description: Invalid date range
  /api/v1/spending/summary:
    get:
      summary: Get spending summary
      parameters:
        - name: X-Workspace-Id
          in: header
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Spending summary
  /api/v1/spending/tag-summary:
    get:
      summary: Get spending per tag
      parameters:
        - name: X-Workspace-Id
          in: header
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Spending per tag
  /api/v1/recommendations:
    get:
      summary: Get budget recommendations
      parameters:
        - name: X-Workspace-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Recommendations for budget management
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
        workspace_id:
          type: string
        name:
          type: string
        type:
          type: string
        currency:
          type: string
        opening_balance_minor:
          type: integer
        archived:
          type: boolean
        created_at:
          type: string
        updated_at:
          type: string
        balance_minor:
          type: integer
    CreateAccountInput:
      type: object
      required:
        - name
        - type
        - currency
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - wallet
            - savings
            - credit
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        opening_balance_minor:
          type: integer
          minimum: 0
    UpdateAccountInput:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - wallet
            - savings
            - credit
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    Tag:
      type: object
      properties:
        id:
          type: string
        workspace_id:
          type: string
        name:
          type: string
        color:
          type: string
        created_at:
          type: string
    CreateTagInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Unique within the workspace, case-insensitive.
        color:
          type: string
          description: Hex color used by the web UI.
    UpdateTagInput:
      type: object
      properties:
        name:
          type: string
          description: Unique within the workspace, case-insensitive.
        color:
          type: string
    Transaction:
      type: object
      properties:
        id:
          type: string
        workspace_id:
          type: string
        account_id:
          type: string
        amount_minor:
          type: integer
          format: int64
        occurred_at:
          type: string
          format: date-time
        description:
          type: string
        notes:
          type: string
        source:
          type: string
          enum:
            - manual
            - whatsapp
            - mcp
            - receipt
            - import
        tag_ids:
          type: array
          items:
            type: string
        transfer_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TransactionPage:
      type: object
      required:
        - transactions
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        next_cursor:
          type: string
          description: Omit when this is the last page.
    CreateTransactionInput:
      type: object
      required:
        - account_id
        - amount_minor
      properties:
        account_id:
          type: string
        amount_minor:
          type: integer
          format: int64
        occurred_at:
          type: string
          format: date-time
        description:
          type: string
        notes:
          type: string
        source:
          type: string
          enum:
            - manual
            - whatsapp
            - mcp
            - receipt
            - import
          default: manual
        tag_ids:
          type: array
          items:
            type: string
    UpdateTransactionInput:
      type: object
      properties:
        account_id:
          type: string
        amount_minor:
          type: integer
          format: int64
        occurred_at:
          type: string
          format: date-time
        description:
          type: string
        notes:
          type: string
        source:
          type: string
          enum:
            - manual
            - whatsapp
            - mcp
            - receipt
            - import
        tag_ids:
          type: array
          items:
            type: string
    Budget:
      type: object
      properties:
        id:
          type: string
        workspace_id:
          type: string
        name:
          type: string
        amount_minor:
          type: integer
        period:
          type: string
          enum:
            - weekly
            - monthly
        start_date:
          type: string
        end_date:
          type: string
        rollover:
          type: boolean
        account_id:
          type: string
        tag_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
        updated_at:
          type: string
    CreateBudgetInput:
      type: object
      required:
        - name
        - amount_minor
        - period
      properties:
        name:
          type: string
        amount_minor:
          type: integer
          minimum: 1
        period:
          type: string
          enum:
            - weekly
            - monthly
        start_date:
          type: string
        end_date:
          type: string
        rollover:
          type: boolean
        account_id:
          type: string
        tag_ids:
          type: array
          items:
            type: string
    UpdateBudgetInput:
      type: object
      properties:
        name:
          type: string
        amount_minor:
          type: integer
        period:
          type: string
          enum:
            - weekly
            - monthly
        start_date:
          type: string
        end_date:
          type: string
        rollover:
          type: boolean
        account_id:
          type: string
        tag_ids:
          type: array
          items:
            type: string
    BudgetSummary:
      type: object
      properties:
        tag_id:
          type: string
        tag_name:
          type: string
        color:
          type: string
        spent_minor:
          type: integer
    SpendingSummary:
      type: object
      properties:
        total_spent_minor:
          type: integer
        transactions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              amount_minor:
                type: integer
                description:
                  type: string
    SpendingTagSummary:
      type: object
      properties:
        tag_spending:
          type: object
          additionalProperties:
            type: integer
    Recommendation:
      type: object
      properties:
        over_budget_tags:
          type: array
          items:
            type: string
        budget_remaining:
          type: object
          additionalProperties:
            type: integer
    Dashboard:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        currency:
          type: string
        total_balance_minor:
          type: integer
        account_count:
          type: integer
        income_minor:
          type: integer
        expense_minor:
          type: integer
        net_minor:
          type: integer
        budgets:
          type: array
          items:
            $ref: "#/components/schemas/BudgetProgress"
        recent_transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
    BudgetProgress:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        period:
          type: string
          enum:
            - weekly
            - monthly
        amount_minor:
          type: integer
        spent_minor:
          type: integer
        remaining_minor:
          type: integer
        rollover:
          type: boolean
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
